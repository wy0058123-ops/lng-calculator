<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="将LNG美元/MMBtu报价快速换算为人民币元/吨，并显示完整计算公式。"
    />
    <meta name="theme-color" content="#f4f1ea" />
    <title>LNG美元英热换算人民币计算器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator" aria-labelledby="page-title">
        <header class="hero">
          <div class="brand-mark" aria-hidden="true">LNG</div>
          <div>
            <p class="eyebrow">LNG PRICE CONVERTER</p>
            <h1 id="page-title">LNG美元英热换算<br />人民币计算器</h1>
            <p class="intro">输入国际LNG报价，即时换算人民币吨价。</p>
          </div>
        </header>

        <form class="input-panel" id="calculator-form" novalidate>
          <div class="field field-primary">
            <label for="usd-price">LNG美元价格</label>
            <div class="input-wrap">
              <span class="prefix">$</span>
              <input
                id="usd-price"
                name="usd-price"
                type="number"
                placeholder="请输入"
                min="0"
                step="0.01"
                inputmode="decimal"
                aria-describedby="usd-unit"
              />
              <span class="suffix" id="usd-unit">美元/MMBtu</span>
            </div>
          </div>

          <div class="field-grid">
            <div class="field muted-field">
              <label for="mmbtu-per-ton">每吨百万英热</label>
              <div class="compact-input">
                <span>1T =</span>
                <input
                  id="mmbtu-per-ton"
                  name="mmbtu-per-ton"
                  type="number"
                  value="52"
                  min="0.01"
                  step="0.01"
                  inputmode="decimal"
                  aria-describedby="heat-hint"
                />
                <span>MMBtu</span>
              </div>
              <p class="field-hint" id="heat-hint">国际默认 1T = 52 MMBtu，可修改</p>
            </div>

            <div class="field muted-field">
              <label for="exchange-rate">美元兑人民币汇率</label>
              <div class="compact-input">
                <span>$1 =</span>
                <input
                  id="exchange-rate"
                  name="exchange-rate"
                  type="number"
                  placeholder="加载中"
                  min="0.0001"
                  step="0.0001"
                  inputmode="decimal"
                  aria-describedby="rate-hint"
                />
                <span>元</span>
              </div>
              <p class="field-hint live-rate" id="rate-hint">正在获取每日美元汇率…</p>
            </div>

            <div class="field muted-field tax-field">
              <label for="tax-rate">税率</label>
              <div class="compact-input">
                <input
                  id="tax-rate"
                  name="tax-rate"
                  type="number"
                  value="9"
                  min="0"
                  step="0.01"
                  inputmode="decimal"
                  aria-describedby="tax-hint"
                />
                <span>%</span>
              </div>
              <p class="field-hint" id="tax-hint">默认税率 9%，可修改</p>
            </div>
          </div>
        </form>

        <section class="result-card" aria-live="polite" aria-atomic="true">
          <p class="result-label">折合含税人民币吨价</p>
          <div class="result-value">
            <span class="currency">¥</span>
            <strong id="result-number">—</strong>
            <span class="result-unit">元/吨</span>
          </div>
          <p class="result-note">理论货值，不含手续费、仓管费、接卸及气化费用</p>
        </section>

        <section class="formula-card" aria-labelledby="formula-title">
          <div class="formula-heading">
            <h2 id="formula-title">本次计算公式</h2>
            <span>实时更新</span>
          </div>
          <p class="formula-main" id="formula-main">
            请填写美元价格，汇率加载后自动计算
          </p>
          <p class="formula-detail" id="formula-detail">
            美元价格 × 人民币汇率 × 每吨百万英热 ×（1＋税率）= 含税人民币元/吨
          </p>
        </section>

        <footer>
          <p>计算结果仅供价格测算，正式结算以合同及船货实际高位热值为准。</p>
        </footer>
      </section>
    </main>
  </body>
</html>
